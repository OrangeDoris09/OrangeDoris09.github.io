<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pets | Luxury Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pets</h1>
    <p class="subtitle">Loyal Companions Through the Years</p>
  </header>

  <main class="container">
    <a href="index.html" class="btn-back">Back to Home</a>

    <section class="pets-grid">
      <article class="pet-card">
        <div class="pet-image">
          <img src="images/paddy.jpg" alt="Photo of Paddy" onerror="this.style.display='none'; this.parentElement.textContent='Paddy';">
        </div>
        <div class="pet-info">
          <h3>Paddy</h3>
          <p class="pet-dates">Dates Unknown</p>
          <span class="pet-status">Companion</span>
        </div>
      </article>

      <article class="pet-card">
        <div class="pet-image">
          <img src="images/major.jpg" alt="Photo of Major" onerror="this.style.display='none'; this.parentElement.textContent='Major';">
        </div>
        <div class="pet-info">
          <h3>Major</h3>
          <p class="pet-dates">14 September 2021 – 22 August 2025</p>
          <span class="pet-status deceased">Remembered</span>
        </div>
      </article>

      <article class="pet-card">
        <div class="pet-image">
          <img src="images/buddy.jpg" alt="Photo of Buddy" onerror="this.style.display='none'; this.parentElement.textContent='Buddy';">
        </div>
        <div class="pet-info">
          <h3>Buddy</h3>
          <p class="pet-dates">July 2021 – Present</p>
          <span class="pet-status">With Us</span>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <div class="gold-line"></div>
    <p>Crafted with care · Luxury Black &amp; Gold</p>
  </footer>
</body>
</html>
